# Build memory — sized for CI (ubuntu-latest: ~4 cores / 16 GB).
# NOTE: do NOT build on the 1 GB Uniweb VPS — it cannot fit a RN release build
# and the kernel OOM-killer will reap the JVM (and risk nginx/php). Releases are
# built in GitHub Actions (.github/workflows/build-apk.yml); the VPS only runs
# `scripts/release.sh --publish-only` to publish the downloaded artifacts.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvm.options=-Xmx1024m -XX:MaxMetaspaceSize=256m
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=false
# New Architecture — disabled for alpha; re-enable after Xray native module matures
newArchEnabled=false
hermesEnabled=true
