<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" role="img" aria-label="Unified coin/button states">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E87A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E87A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="560" height="220" fill="#070D18"/>

  <!-- Idle -->
  <circle cx="90" cy="100" r="60" fill="#0D1828" stroke="#1E2A3D" stroke-width="2"/>
  <circle cx="90" cy="100" r="18" fill="none" stroke="rgba(200,210,218,0.9)" stroke-width="3"/>
  <text x="90" y="190" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8894A3">Idle</text>

  <!-- Pressed (scale 0.93, no glow yet) -->
  <circle cx="280" cy="100" r="56" fill="#0D1828" stroke="#1E2A3D" stroke-width="2" transform="translate(0,2)"/>
  <circle cx="280" cy="100" r="17" fill="none" stroke="rgba(200,210,218,0.9)" stroke-width="3"/>
  <text x="280" y="190" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8894A3">Pressed (scale 0.93)</text>

  <!-- Connected + gold burst -->
  <circle cx="470" cy="100" r="78" fill="url(#glow)"/>
  <circle cx="470" cy="100" r="60" fill="none" stroke="#00E87A" stroke-opacity="0.15" stroke-width="10"/>
  <circle cx="470" cy="100" r="60" fill="#00E87A" stroke="#00E87A" stroke-width="2"/>
  <circle cx="470" cy="100" r="18" fill="none" stroke="#0C1116" stroke-width="3"/>
  <circle cx="470" cy="34" r="5" fill="#D4AF37"/>
  <circle cx="518" cy="60" r="4" fill="#D4AF37"/>
  <circle cx="522" cy="110" r="4.5" fill="#D4AF37"/>
  <circle cx="422" cy="58" r="4" fill="#D4AF37"/>
  <circle cx="418" cy="120" r="4.5" fill="#D4AF37"/>
  <text x="470" y="190" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8894A3">Connected + gold burst</text>
</svg>
