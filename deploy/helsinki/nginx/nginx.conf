user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens build; # Recommended practice is to turn this off

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3 (POODLE), TLS 1.0, 1.1
	ssl_prefer_server_ciphers off; # Don't force server cipher order.

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


# === SetaLink Helsinki SNI-dispatch (mirrors Denmark prod) ===
stream {
    map $ssl_preread_server_name $tls_backend {
        www.cloudflare.com  127.0.0.1:8443;
        www.microsoft.com   127.0.0.1:8444;
        www.apple.com       127.0.0.1:8445;
        www.google.com      127.0.0.1:9446;  # recovery: rate-limited relay
        default             127.0.0.1:4430;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass            $tls_backend;
        proxy_connect_timeout 10s;
        proxy_timeout         86400s;
        proxy_buffer_size     16k;
    }
    # Recovery rate-limited relay (512 kbps = 64 kB/s per direction, 20-min TTL)
    server {
        listen 127.0.0.1:9446;
        proxy_pass 127.0.0.1:8446;
        proxy_download_rate 64k;
        proxy_upload_rate   64k;
        proxy_connect_timeout 5s;
        proxy_timeout 1200s;
    }
}
