# SetaLink logrotate config -- Storage Manager Fase 1 (2026-07-17).
#
# Covers what lib/storage_manager.php CANNOT touch: /var/log/nginx/*.log and
# /var/log/xray/*.log are root-owned (admin/api.php already notes
# "/var/log/xray is root-only" for the same reason its own log-export script
# has to run via sudo). www-data (the PHP process) can't rotate these itself
# -- logrotate, run by root via its own daily systemd timer/cron entry, is
# the standard, correct mechanism for exactly this.
#
# Install (one-time, requires root -- this is NOT something the app installs
# itself):
#   sudo cp deploy/system/setalink-logrotate.conf /etc/logrotate.d/setalink
#   sudo logrotate -d /etc/logrotate.d/setalink   # dry run, verify no errors
#
# Compression: 'compress' + 'delaycompress' means today's rotated log stays
# uncompressed for one more cycle (so a same-day tail/grep still works
# uncompressed) and everything older gets gzipped -- "automatisk komprimering
# av gamle logger" from the Fase 1 request.

/var/log/nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid) 2>/dev/null || true
    endscript
}

/var/log/xray/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    # xray-core has no equivalent of nginx's USR1 log-reopen signal in every
    # version -- copytruncate avoids needing to restart/signal the service
    # at all (writes continue to the same inode, logrotate just truncates
    # after copying). Slight risk of losing a few log lines written in the
    # instant between copy and truncate; acceptable for access/error logs
    # that already feed a DB-backed analytics pipeline (lib/node_intel.php),
    # not the source of truth themselves.
    copytruncate
}

/var/log/setalink/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
