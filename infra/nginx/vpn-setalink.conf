# RealGram / SetaLink VPN edge
#
# Public TCP/443 is owned by the nginx stream{} SNI router in nginx.conf.
# The stream router must send vpn.setalink.no to 127.0.0.1:4434.
# This vhost terminates TLS and proxies the three non-Reality VLESS transports
# to their loopback-only Xray inbounds.
#
# Xray mapping:
#   /ws       -> VLESS WebSocket    127.0.0.1:10000
#   /xhttp/   -> VLESS XHTTP        127.0.0.1:10001
#   /httpup   -> VLESS HTTPUpgrade  127.0.0.1:10002
#
# Reality is NOT terminated here. Reality SNI (currently www.cloudflare.com and
# www.microsoft.com) is stream-routed directly to the Xray Reality inbound.

server {
    listen 80;
    listen [::]:80;
    server_name vpn.setalink.no;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Simple HTTP reachability check. This does not assert that VPN transports work.
    location / {
        default_type text/plain;
        return 200 "ok\n";
    }
}

server {
    # Deliberately loopback-only. Public :443 reaches this listener through
    # nginx stream{} after ssl_preread selects vpn.setalink.no.
    listen 127.0.0.1:4434 ssl;
    http2 on;
    server_name vpn.setalink.no;

    ssl_certificate     /etc/letsencrypt/live/vpn.setalink.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.setalink.no/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;

    # VLESS WebSocket. Client forces HTTP/1.1 ALPN for RFC6455 Upgrade.
    location /ws {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # VLESS XHTTP stream-one. Keep request/response streaming unbuffered.
    # Trailing slash is intentional and must match the Xray inbound/client path.
    location /xhttp/ {
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # VLESS HTTPUpgrade. Client uses HTTP/1.1 Upgrade semantics.
    location /httpup {
        proxy_pass http://127.0.0.1:10002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # HTTPS reachability check for this dedicated edge vhost.
    location = /healthz {
        default_type text/plain;
        return 200 "vpn-edge-ok\n";
    }

    location / {
        default_type text/plain;
        return 404 "not found\n";
    }
}
