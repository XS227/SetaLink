name: iOS — TestFlight

# Secrets required (Settings → Secrets → Actions):
#   ASC_KEY_ID                  App Store Connect API Key ID
#   ASC_ISSUER_ID               App Store Connect Issuer ID
#   ASC_PRIVATE_KEY             Full contents of AuthKey_XXXX.p8 (multiline)
#   APPLE_TEAM_ID               10-character Apple Team ID
#
# Optional (set after first bootstrap run to avoid recreating the cert each time):
#   DISTRIBUTION_CERT_P12_BASE64   base64 of the exported Distribution cert P12
#   DISTRIBUTION_CERT_PASSWORD     password used when exporting the P12
#
# Bootstrap flow (first run, or when P12 secrets are not set):
#   fastlane cert --force creates a fresh cert+key, then the workflow uploads
#   a "cert-bootstrap" artifact containing the base64 P12. Download it, then
#   add DISTRIBUTION_CERT_P12_BASE64 + DISTRIBUTION_CERT_PASSWORD as secrets.
#   Subsequent runs skip fastlane cert entirely and import the stored P12.

on:
  push:
    tags:
      - 'v*-ios'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion override (leave blank to use run number)'
        required: false
        default: ''
      force_bootstrap:
        description: 'Force bootstrap: regenerate Distribution cert + P12 (use when cert revoked)'
        required: false
        default: 'false'

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    env:
      BUNDLE_ID:        no.setalink.realink
      TUNNEL_BUNDLE_ID: no.setalink.realink.tunnel

    steps:
      # ── Select Xcode ─────────────────────────────────────────────────────────
      # Apple requires iOS 26 SDK for App Store uploads; pick the highest
      # Xcode available (prefers 26.x on macos-15, falls back to 16.x).
      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No versioned Xcode found, using default"; xcodebuild -version
          else
            echo "Using $XCODE"
            sudo xcode-select -s "$XCODE/Contents/Developer"
            xcodebuild -version
          fi

      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node ─────────────────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile-app
        run: npm ci --prefer-offline

      # ── Ruby + fastlane ──────────────────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install fastlane + CocoaPods
        run: gem install fastlane cocoapods --no-document

      # ── CocoaPods ────────────────────────────────────────────────────────────
      - name: pod install
        working-directory: mobile-app
        run: pod install --project-directory=ios --repo-update

      # ── App Store Connect API key file ────────────────────────────────────────
      # Written to a temp file; never printed, never committed.
      - name: Write ASC API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          # Write the .p8 key file (fastlane reads it from here)
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          # Write the JSON key descriptor that fastlane cert/sigh accept
          cat > "$RUNNER_TEMP/asc/api_key.json" <<JSON
          {
            "key_id":    "$ASC_KEY_ID",
            "issuer_id": "$ASC_ISSUER_ID",
            "key":       "$(cat $RUNNER_TEMP/asc/AuthKey.p8 | awk '{printf "%s\\n", $0}')",
            "duration":  1200,
            "in_house":  false
          }
          JSON
          chmod 600 "$RUNNER_TEMP/asc/api_key.json"
          echo "ASC_API_KEY_PATH=$RUNNER_TEMP/asc/api_key.json" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8"        >> "$GITHUB_ENV"

      # ── Create temporary signing keychain ────────────────────────────────────
      - name: Create signing keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"   >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS"   >> "$GITHUB_ENV"

      # ── Distribution Certificate ─────────────────────────────────────────────
      # Normal mode: import stored P12 from secrets (no new cert created).
      # Bootstrap mode: fastlane cert --force (needs one free cert slot in Apple).
      - name: Import Distribution Certificate
        env:
          APPLE_TEAM_ID:                ${{ secrets.APPLE_TEAM_ID }}
          DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.DISTRIBUTION_CERT_P12_BASE64 }}
          DISTRIBUTION_CERT_PASSWORD:   ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}
        run: |
          FORCE_BOOTSTRAP="${{ github.event.inputs.force_bootstrap }}"
          if [ -n "$DISTRIBUTION_CERT_P12_BASE64" ] && [ "$FORCE_BOOTSTRAP" != "true" ]; then
            echo "Using stored P12 from secret."
            echo "$DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/dist.p12"
            security import "$RUNNER_TEMP/asc/dist.p12" \
              -k "$KEYCHAIN_PATH" -P "$DISTRIBUTION_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: \
              -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            echo "BOOTSTRAPPED=false" >> "$GITHUB_ENV"
          else
            echo "No stored P12 found — running fastlane cert (bootstrap mode)."
            fastlane cert \
              --api_key_path      "$ASC_API_KEY_PATH" \
              --team_id           "$APPLE_TEAM_ID" \
              --output_path       "$RUNNER_TEMP/asc" \
              --keychain_path     "$KEYCHAIN_PATH" \
              --keychain_password "$KEYCHAIN_PASS" \
              --platform          "ios" \
              --force
            # Export cert+key as P12 for future runs
            P12_PASS="$(openssl rand -hex 16)"
            CERT_FILE=$(ls "$RUNNER_TEMP/asc/"*.cer 2>/dev/null | head -1)
            security export \
              -k "$KEYCHAIN_PATH" -t identities \
              -f pkcs12 -P "$P12_PASS" \
              -o "$RUNNER_TEMP/asc/dist.p12"
            echo "BOOTSTRAP_P12_B64=$(base64 -i "$RUNNER_TEMP/asc/dist.p12")" >> "$GITHUB_ENV"
            echo "BOOTSTRAP_P12_PASS=$P12_PASS"                                >> "$GITHUB_ENV"
            echo "BOOTSTRAPPED=true"                                            >> "$GITHUB_ENV"
          fi
          CERT_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -o '"Apple Distribution[^"]*"' | head -1 | tr -d '"')
          echo "CERT_NAME=${CERT_NAME:-Apple Distribution}" >> "$GITHUB_ENV"

      # ── Save bootstrap P12 as artifact (only on first/bootstrap run) ──────────
      - name: Save cert bootstrap artifact
        if: env.BOOTSTRAPPED == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bootstrap"
          echo "$BOOTSTRAP_P12_B64"  > "$RUNNER_TEMP/bootstrap/DISTRIBUTION_CERT_P12_BASE64.txt"
          echo "$BOOTSTRAP_P12_PASS" > "$RUNNER_TEMP/bootstrap/DISTRIBUTION_CERT_PASSWORD.txt"
          echo "Bootstrap artifact created."
          echo "After this run: download the 'cert-bootstrap' artifact, then add"
          echo "DISTRIBUTION_CERT_P12_BASE64 and DISTRIBUTION_CERT_PASSWORD as GitHub Secrets."
        working-directory: mobile-app

      - name: Upload cert bootstrap artifact
        if: env.BOOTSTRAPPED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cert-bootstrap
          path: ${{ runner.temp }}/bootstrap/
          retention-days: 1

      # ── Generate App Store Provisioning Profile ──────────────────────────────
      # fastlane sigh creates or renews the profile, downloads it, and installs it.
      - name: Generate / fetch Provisioning Profile (fastlane sigh)
        working-directory: mobile-app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          fastlane sigh \
            --api_key_path      "$ASC_API_KEY_PATH" \
            --app_identifier    "$BUNDLE_ID" \
            --team_id           "$APPLE_TEAM_ID" \
            --provisioning_name "Realink AppStore" \
            --output_path       "$RUNNER_TEMP/asc" \
            --filename          "Realink_AppStore.mobileprovision" \
            --platform          "ios" \
            --force
          PROFILE_PATH="$RUNNER_TEMP/asc/Realink_AppStore.mobileprovision"
          # Install into the standard location xcodebuild expects
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      # ── Tunnel Extension Provisioning Profile ────────────────────────────────
      # The tunnel extension has its own bundle ID and needs a separate profile.
      # Requires App ID 'no.setalink.realink.tunnel' to exist in App Store Connect
      # with the 'Network Extensions' and 'App Groups' capabilities enabled.
      - name: Generate / fetch Tunnel Extension Provisioning Profile
        working-directory: mobile-app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          fastlane sigh \
            --api_key_path      "$ASC_API_KEY_PATH" \
            --app_identifier    "$TUNNEL_BUNDLE_ID" \
            --team_id           "$APPLE_TEAM_ID" \
            --provisioning_name "Realink Tunnel AppStore" \
            --output_path       "$RUNNER_TEMP/asc" \
            --filename          "Realink_Tunnel_AppStore.mobileprovision" \
            --platform          "ios" \
            --force
          TUNNEL_PROFILE_PATH="$RUNNER_TEMP/asc/Realink_Tunnel_AppStore.mobileprovision"
          TUNNEL_PROFILE_UUID=$(security cms -D -i "$TUNNEL_PROFILE_PATH" \
            | plutil -extract UUID raw -)
          cp "$TUNNEL_PROFILE_PATH" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$TUNNEL_PROFILE_UUID".mobileprovision
          echo "TUNNEL_PROFILE_UUID=$TUNNEL_PROFILE_UUID" >> "$GITHUB_ENV"

      # ── libXray — pinned tag ─────────────────────────────────────────────────
      # PINNED to v26.6.1 — do NOT change to 'latest'.
      #
      # Why pinned: libxray changed its gomobile API from raw-JSON input to
      # base64-encoded CallRequest/CallResponse in v25.x+. Silently upgrading
      # to a future version that changes the API again would break the iOS VPN
      # tunnel with no compile-time warning (the function signature stays the
      # same; only the expected encoding changes).
      #
      # To upgrade: read the new xray_wrapper.go, verify RunXrayFromJSON still
      # accepts base64({datDir, configJSON}), update PacketTunnelProvider.swift
      # if needed, then bump this pin.
      - name: Set libXray tag
        run: |
          LIBXRAY_TAG="v26.6.1"
          echo "Using pinned libXray tag: $LIBXRAY_TAG"
          echo "LIBXRAY_TAG=$LIBXRAY_TAG" >> "$GITHUB_ENV"

      # ── libXray — restore cached xcframework ─────────────────────────────────
      - name: Cache LibXray.xcframework
        id: cache-libxray
        uses: actions/cache@v4
        with:
          path: mobile-app/ios/LibXray.xcframework
          key: libxray-xcframework-${{ env.LIBXRAY_TAG }}-macos15

      # ── libXray — build from source (cache miss only) ────────────────────────
      # gomobile bind produces LibXray.xcframework for arm64 iOS device + simulator.
      # The build takes ~10 min on a fresh runner; subsequent runs hit the cache.
      - name: Setup Go (for libXray build)
        if: steps.cache-libxray.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Build LibXray.xcframework
        if: steps.cache-libxray.outputs.cache-hit != 'true'
        run: |
          set -e
          WORK_DIR="$RUNNER_TEMP/libxray-src"
          git clone --depth=1 --branch "$LIBXRAY_TAG" \
            https://github.com/xtls/libxray.git "$WORK_DIR"
          cd "$WORK_DIR"
          # Install gomobile toolchain
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          # Build for iOS (device + simulator, both arm64)
          python3 build/main.py apple gomobile
          # Locate the produced xcframework (output dir varies by libXray version)
          XCFW=$(find . -name "LibXray.xcframework" -maxdepth 6 -type d 2>/dev/null | head -1)
          if [ -z "$XCFW" ]; then
            echo "ERROR: LibXray.xcframework not found after build. Directory listing:"
            find . -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "Found: $XCFW"
          cp -R "$XCFW" "$GITHUB_WORKSPACE/mobile-app/ios/LibXray.xcframework"
          echo "LibXray.xcframework copied to ios/"

      # ── Build number ─────────────────────────────────────────────────────────
      - name: Set build number
        run: |
          INPUT="${{ github.event.inputs.build_number }}"
          echo "BUILD_NUMBER=${INPUT:-${{ github.run_number }}}" >> "$GITHUB_ENV"

      # ── Sync version.ts ──────────────────────────────────────────────────────
      # release.sh only updates version.ts for Android APK builds (it reads from
      # build.gradle). The iOS CI must regenerate this file itself so the JS bundle
      # reports the correct app version and build number instead of a stale value.
      - name: Sync version.ts to iOS build
        working-directory: mobile-app
        run: |
          {
            echo "// AUTO-GENERATED by ios-testflight.yml — do not edit by hand."
            echo "export const APP_VERSION    = '0.9.50';"
            echo "export const APP_BUILD      = '${BUILD_NUMBER}';"
            echo "export const APP_BUILD_CODE = ${BUILD_NUMBER};"
          } > src/utils/version.ts
          echo "version.ts → 0.9.50 / build ${BUILD_NUMBER}"

      # ── Archive ──────────────────────────────────────────────────────────────
      # Uses an xcconfig to set per-target provisioning profiles (Realink vs
      # RealinkTunnel have different bundle IDs and therefore different profiles).
      # The $(TARGET_NAME:identifier) macro expands to the target name per build,
      # so each target picks up its own PROVISIONING_PROFILE_SPECIFIER value.
      - name: Archive (Release)
        working-directory: mobile-app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Generate per-target signing xcconfig
          cat > "$RUNNER_TEMP/ci_signing.xcconfig" <<XCCONFIG
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          DEVELOPMENT_TEAM = $APPLE_TEAM_ID
          PROVISIONING_PROFILE_SPECIFIER = \$(PROVISIONING_PROFILE_SPECIFIER_\$(TARGET_NAME:identifier))
          PROVISIONING_PROFILE_SPECIFIER_Realink = $PROFILE_UUID
          PROVISIONING_PROFILE_SPECIFIER_RealinkTunnel = $TUNNEL_PROFILE_UUID
          XCCONFIG

          xcodebuild archive \
            -workspace               ios/Realink.xcworkspace \
            -scheme                  Realink \
            -configuration           Release \
            -archivePath             "$RUNNER_TEMP/Realink.xcarchive" \
            -xcconfig                "$RUNNER_TEMP/ci_signing.xcconfig" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=0.9.50 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=LIBXRAY_AVAILABLE \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      # ── Export IPA ───────────────────────────────────────────────────────────
      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>             <string>app-store-connect</string>
            <key>teamID</key>             <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>       <string>manual</string>
            <key>uploadBitcode</key>      <false/>
            <key>uploadSymbols</key>      <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
              <key>$TUNNEL_BUNDLE_ID</key>
              <string>$TUNNEL_PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath        "$RUNNER_TEMP/Realink.xcarchive" \
            -exportPath         "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # ── Upload to TestFlight ─────────────────────────────────────────────────
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app \
            --type      ios \
            --file      "$RUNNER_TEMP/ipa/Realink.ipa" \
            --apiKey    "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # ── Keep IPA as artifact ─────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Realink-${{ env.BUILD_NUMBER }}.ipa
          path: ${{ runner.temp }}/ipa/Realink.ipa
          retention-days: 14

      # ── Cleanup — wipe all credential material from the runner ───────────────
      - name: Wipe credentials
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc"
