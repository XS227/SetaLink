name: iOS — TestFlight

# Secrets required (Settings → Secrets → Actions) — enter in GitHub UI only:
#   ASC_KEY_ID        App Store Connect API Key ID
#   ASC_ISSUER_ID     App Store Connect Issuer ID
#   ASC_PRIVATE_KEY   Full contents of AuthKey_XXXX.p8 (multiline — paste as-is)
#   APPLE_TEAM_ID     10-character Apple Team ID
#
# No certificate, no provisioning profile, no P12 stored anywhere.
# fastlane cert + sigh generate them fresh on the macOS runner using the API key.

on:
  push:
    tags:
      - 'v*-ios'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion override (leave blank to use run number)'
        required: false
        default: ''

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 60

    env:
      BUNDLE_ID: no.setalink.realink

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node ─────────────────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile-app
        run: npm ci --prefer-offline

      # ── Ruby + fastlane ──────────────────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install fastlane + CocoaPods
        run: gem install fastlane cocoapods --no-document

      # ── CocoaPods ────────────────────────────────────────────────────────────
      - name: pod install
        working-directory: mobile-app
        run: pod install --project-directory ios --repo-update

      # ── App Store Connect API key file ────────────────────────────────────────
      # Written to a temp file; never printed, never committed.
      - name: Write ASC API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          # Write the .p8 key file (fastlane reads it from here)
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          # Write the JSON key descriptor that fastlane cert/sigh accept
          cat > "$RUNNER_TEMP/asc/api_key.json" <<JSON
          {
            "key_id":    "$ASC_KEY_ID",
            "issuer_id": "$ASC_ISSUER_ID",
            "key":       "$(cat $RUNNER_TEMP/asc/AuthKey.p8 | awk '{printf "%s\\n", $0}')",
            "duration":  1200,
            "in_house":  false
          }
          JSON
          chmod 600 "$RUNNER_TEMP/asc/api_key.json"
          echo "ASC_API_KEY_PATH=$RUNNER_TEMP/asc/api_key.json" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8"        >> "$GITHUB_ENV"

      # ── Create temporary signing keychain ────────────────────────────────────
      - name: Create signing keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"   >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS"   >> "$GITHUB_ENV"

      # ── Generate Apple Distribution Certificate ──────────────────────────────
      # fastlane cert calls the ASC API, creates the cert if it does not exist,
      # downloads it, and imports it (with its private key) into the keychain.
      - name: Generate / fetch Distribution Certificate (fastlane cert)
        working-directory: mobile-app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          fastlane cert \
            --api_key_path      "$ASC_API_KEY_PATH" \
            --team_id           "$APPLE_TEAM_ID" \
            --output_path       "$RUNNER_TEMP/asc" \
            --keychain_path     "$KEYCHAIN_PATH" \
            --keychain_password "$KEYCHAIN_PASS" \
            --platform          "ios"
          # Capture the certificate name fastlane installed (for xcodebuild)
          CERT_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -o '"Apple Distribution[^"]*"' | head -1 | tr -d '"')
          echo "CERT_NAME=${CERT_NAME:-Apple Distribution}" >> "$GITHUB_ENV"

      # ── Generate App Store Provisioning Profile ──────────────────────────────
      # fastlane sigh creates or renews the profile, downloads it, and installs it.
      - name: Generate / fetch Provisioning Profile (fastlane sigh)
        working-directory: mobile-app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          fastlane sigh \
            --api_key_path      "$ASC_API_KEY_PATH" \
            --app_identifier    "$BUNDLE_ID" \
            --team_id           "$APPLE_TEAM_ID" \
            --provisioning_name "Realink AppStore" \
            --output_path       "$RUNNER_TEMP/asc" \
            --filename          "Realink_AppStore.mobileprovision" \
            --platform          "ios" \
            --force
          PROFILE_PATH="$RUNNER_TEMP/asc/Realink_AppStore.mobileprovision"
          # Install into the standard location xcodebuild expects
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      # ── Build number ─────────────────────────────────────────────────────────
      - name: Set build number
        run: |
          INPUT="${{ github.event.inputs.build_number }}"
          echo "BUILD_NUMBER=${INPUT:-${{ github.run_number }}}" >> "$GITHUB_ENV"

      # ── Archive ──────────────────────────────────────────────────────────────
      - name: Archive (Release)
        working-directory: mobile-app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace               ios/Realink.xcworkspace \
            -scheme                  Realink \
            -configuration           Release \
            -archivePath             "$RUNNER_TEMP/Realink.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=0.9.47 \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CODE_SIGN_STYLE=Manual \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      # ── Export IPA ───────────────────────────────────────────────────────────
      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>             <string>app-store</string>
            <key>teamID</key>             <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>       <string>manual</string>
            <key>uploadBitcode</key>      <false/>
            <key>uploadSymbols</key>      <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>Realink AppStore</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath        "$RUNNER_TEMP/Realink.xcarchive" \
            -exportPath         "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # ── Upload to TestFlight ─────────────────────────────────────────────────
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app \
            --type      ios \
            --file      "$RUNNER_TEMP/ipa/Realink.ipa" \
            --apiKey    "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # ── Keep IPA as artifact ─────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Realink-${{ env.BUILD_NUMBER }}.ipa
          path: ${{ runner.temp }}/ipa/Realink.ipa
          retention-days: 14

      # ── Cleanup — wipe all credential material from the runner ───────────────
      - name: Wipe credentials
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc"
