name: Release Windows (RealGram desktop, chat-only)

# Manual only — never on push. Same standing rule as release-apk.yml/
# ios-testflight.yml: no build/publish without an explicit go per run.
#
# This produces a single installer exe (RealGram-Setup.exe, built with Inno
# Setup from mobile-app/windows/installer/RealGram.iss): download, double-
# click, Next/Next/Finish, app launches — no manually opening a Dependencies
# folder first. It is still NOT an MSIX/code-signed installer (see the .iss
# file's header for why that path was dropped) — Windows still shows one
# generic "unknown publisher" SmartScreen prompt on first run, same as any
# unsigned installer. See mobile-app/react-native.config.js for which native
# modules (calling, ads, live TV) are intentionally excluded on this
# platform — none of them have a Windows implementation.
#
# This machine (the Linux VPS that normally runs release-apk.yml) cannot
# build this itself — react-native-windows compiles via MSBuild against the
# Windows SDK/WinAppSDK, which only exists on a real Windows toolchain. Hence
# windows-latest here, unlike every other workflow in this repo.
on:
  workflow_dispatch:

jobs:
  build-release:
    name: Build Windows release (unpackaged, x64)
    # Pinned, not windows-latest: as of this writing "latest" resolves to
    # windows-2025-vs2026 (Visual Studio 2026 / v18.x) — react-native-windows
    # 0.75.4's CLI hardcodes a [17.11.0, 18.0) version-range check (VS 2022
    # only) when locating MSBuild, so it reports "No public VS release
    # found" against a VS2026 image even though VS itself (with the right
    # workloads) is present and rnw-dependencies.ps1's own laxer check (no
    # upper version bound) reports "All mandatory requirements met." for
    # the exact same install. windows-2022 ships VS 2022, matching what this
    # RNW version actually looks for.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: mobile-app/node_modules
          key: node-modules-windows-${{ hashFiles('mobile-app/package.json') }}
          restore-keys: node-modules-windows-

      - name: Install JS dependencies
        working-directory: mobile-app
        run: npm install

      # windows-latest ships Visual Studio 2022 Enterprise, but not the C++
      # (VCTools)/UWP workloads react-native-windows needs to build — first
      # CI run failed with "Could not find MSBuild with VCTools" for exactly
      # this reason. RNW ships its own dependency installer for this; the
      # `buildLab` tag is the CI-appropriate subset (skips IDE-only
      # components like UWP.VC that a real dev machine needs but a headless
      # build doesn't — see the script's own comment on that flag).
      - name: Install RNW build dependencies (VS C++/UWP workloads)
        working-directory: mobile-app
        shell: pwsh
        run: .\node_modules\react-native-windows\Scripts\rnw-dependencies.ps1 -Install -NoPrompt buildLab

      # `react-native run-windows` shells out to msbuild.exe directly (not
      # through Visual Studio, which would auto-restore on load) — it does
      # NOT restore NuGet packages first. Third/fourth CI runs got 15+
      # minutes into the actual compile and failed on a packages.config
      # NuGet package (Microsoft.Windows.CppWinRT) missing.
      - name: Restore NuGet packages (solution — modern PackageReference projects)
        working-directory: mobile-app/windows
        run: nuget restore setalink.sln

      # setalink.sln only lists the app itself + react-native-windows's own
      # core projects (Folly/Common/ReactCommon/Microsoft.ReactNative) — the
      # solution-level restore above only walks THOSE. Autolinked native
      # modules that ship their own Windows implementation (react-native-
      # screens, in this build) are pulled in via a <ProjectReference> from
      # AutolinkedNativeModules.g.targets straight into setalink.vcxproj,
      # bypassing the .sln entirely — MSBuild still builds them (which is
      # why the compile error surfaced inside RNScreens.vcxproj at all), but
      # `nuget restore <sln>` never reaches their own (older, packages.config
      # -style, not PackageReference) NuGet references. Restore each one
      # directly, into the same windows/packages/ folder their .vcxproj
      # HintPaths expect (confirmed from the earlier error's file path).
      - name: Restore NuGet packages (autolinked native modules' packages.config)
        working-directory: mobile-app
        shell: pwsh
        run: |
          Get-ChildItem -Path node_modules -Recurse -Filter packages.config -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\example\\' } |
            ForEach-Object {
              Write-Host "Restoring: $($_.FullName)"
              nuget restore $_.FullName -SolutionDirectory windows
            }

      # Builds the Visual Studio solution under mobile-app/windows via
      # MSBuild. --no-deploy skips registering/launching the app on this
      # runner (there's no interactive session to deploy into); --no-packager
      # skips starting a Metro dev server, which a --release build bundles
      # past anyway.
      - name: Build Windows app (Release, x64)
        working-directory: mobile-app
        run: npx react-native run-windows --release --arch x64 --no-launch --no-deploy --no-packager --logging

      # The Release build produces two things, confirmed from run #5's log:
      #   1. A loose exe: windows/x64/Release/setalink/setalink.exe (+ DLLs)
      #   2. windows/AppPackages/setalink/setalink_<version>_x64_Test/ — a
      #      real sideloadable app package: the .msix itself, its
      #      Dependencies/ (VCLibs/WinUI runtime redistributables), and
      #      Add-AppDevPackage.ps1 — Microsoft's own standard "install this
      #      unsigned/test-signed package" script (installs a dev cert, then
      #      the package).
      #
      # Went with the .msix build (#6) first, on the theory it'd feel more
      # like "download and install" than a bare exe folder. Khabat hit
      # "this app package's publisher certificate could not be verified"
      # installing it — the test cert either isn't trusted by
      # Add-AppDevPackage.ps1 cleanly on every machine, or needs Developer
      # Mode enabled first; either way it's friction we don't need for v1
      # with no code-signing infra behind it. Back to the loose exe (#8):
      # no install step, no cert, no SmartScreen-adjacent prompts beyond
      # the normal "unknown publisher" exe warning.
      #
      # #8 alone then failed to *launch* on Khabat's machine — "the code
      # execution cannot proceed because VCRUNTIME140_1_APP.DLL was not
      # found" (also MSVCP140_APP.DLL). Those `_app`-suffixed CRT
      # forwarders are the UWP/WinRT variant of the VC++ runtime that
      # Microsoft.ReactNative's C++/WinRT projection needs even in an
      # unpackaged Win32 exe — they're normally provided by the
      # Microsoft.VCLibs.140.00 UWP-desktop framework package, which is
      # exactly what was sitting in the .msix's Dependencies/ folder we
      # dropped when we stopped zipping AppPackages. `react-native run-
      # windows` still builds that AppPackages output even though we only
      # zip the loose exe from it — so pull Dependencies/ back in
      # alongside the exe (not the .msix itself, not
      # Add-AppDevPackage.ps1). Those redistributable .appx files are
      # signed by Microsoft directly, not by our test cert, so installing
      # them doesn't hit the "publisher could not be verified" prompt —
      # one-time double-click install, then setalink.exe just runs.
      - name: Locate build output
        working-directory: mobile-app/windows
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "setalink.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "No setalink.exe found under windows/x64/Release"; exit 1 }
          Write-Host "Found exe: $($exe.FullName)"

          $deps = Get-ChildItem -Path AppPackages -Recurse -Directory -Filter "Dependencies" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $deps) { Write-Error "No Dependencies folder found under windows/AppPackages"; exit 1 }
          Write-Host "Found dependencies: $($deps.FullName)"

      # Replaces the old "zip of a loose exe + a Dependencies folder the user
      # had to manually double-click through" with ONE installer exe:
      # download, double-click, Next/Next/Finish, app launches. The .iss
      # script (mobile-app/windows/installer/RealGram.iss) silently installs
      # the same Microsoft-signed VCLibs/WinUI .appx redistributables in its
      # own [Run] step instead of asking the user to do it by hand — see
      # that file's header comment for the full rationale. windows-2022
      # ships Inno Setup 6 preinstalled, so no separate install step here.
      - name: Stage installer inputs
        working-directory: mobile-app/windows
        shell: pwsh
        run: |
          $stage = "installer\build"
          New-Item -ItemType Directory -Path "$stage\AppFiles" -Force | Out-Null
          New-Item -ItemType Directory -Path "$stage\Dependencies" -Force | Out-Null

          $outDir = (Get-ChildItem -Recurse -Filter "setalink.exe" | Select-Object -First 1).DirectoryName
          Copy-Item -Path "$outDir\*" -Destination "$stage\AppFiles" -Recurse -Force

          $depsDir = (Get-ChildItem -Path AppPackages -Recurse -Directory -Filter "Dependencies" | Select-Object -First 1).FullName
          Copy-Item -Path "$depsDir\*" -Destination "$stage\Dependencies" -Recurse -Force

      - name: Compile installer (Inno Setup)
        working-directory: mobile-app/windows/installer
        shell: pwsh
        run: |
          $version = (Get-Content ..\..\package.json | ConvertFrom-Json).version
          Write-Host "Building installer for version $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppFilesDir=build\AppFiles" `
            "/DDependenciesDir=build\Dependencies" `
            "/DAppVersion=$version" `
            RealGram.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC.exe failed"; exit 1 }
          if (-not (Test-Path "Output\RealGram-Setup.exe")) { Write-Error "RealGram-Setup.exe not produced"; exit 1 }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: realgram-windows-setup-${{ github.run_number }}
          path: mobile-app/windows/installer/Output/RealGram-Setup.exe
          retention-days: 30
          if-no-files-found: error
